<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13283d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fuel</title>
<style>
:root{--bg:#13283d;--card:#1b3550;--line:#2f4d6c;--tx:#f4ead9;--mu:#a3b9cc;--ac:#a9c08a;--p:#6db3e0;--c:#e8c887;--f:#e0948a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
h2{margin:6px 0 12px;font-size:22px;display:flex;align-items:center;gap:8px}
h3{margin:0 0 10px}
.muted{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.sh2{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sp{flex:1}
button{font:inherit;color:var(--tx);background:#2a4968;border:0;border-radius:10px;padding:10px 14px}
button.pri{background:var(--ac);color:#13283d;font-weight:700}
button.dng{background:#7b3b3b}
button.sm{padding:6px 10px;font-size:13px}
button.add{width:36px;height:36px;padding:0;font-size:22px;background:var(--ac);color:#13283d;border-radius:50%}
button.on,.chip.on{background:var(--ac);color:#13283d}
.chip{padding:7px 12px;border-radius:99px;font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
input,select{font:inherit;color:var(--tx);background:#13283d;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.bar{display:flex;gap:8px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#0e2033;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;padding:10px 0 8px;font-size:11px;color:var(--mu)}
nav button.on{background:none;color:var(--ac)}
nav b{display:block;font-size:20px;font-weight:400}
.ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shx{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border:1px solid var(--line)}
.mb{margin:7px 0}.ml{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.bt{height:8px;background:#284866;border-radius:9px;overflow:hidden}.bt i{display:block;height:100%}
.top{display:flex;align-items:center;gap:12px}
.rn{fill:var(--tx);font-size:26px;font-weight:700}.rl{fill:var(--mu);font-size:11px}
.dn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.dn button{padding:8px 14px}
.vid{background:#000;border-radius:12px;overflow:hidden;margin-bottom:8px}
.vid video{width:100%;display:block;max-height:46vh;object-fit:cover}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2a4968;padding:10px 16px;border-radius:99px;z-index:50;display:none}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
svg text{font-family:inherit}
.star{font-size:20px;background:none;padding:2px 8px;color:var(--mu)}.star.on{background:none;color:#e8c887}
.warn{color:#e8c887;font-size:13px}
.tick{background:none;padding:0 8px 0 0;font-size:24px;color:var(--ac);line-height:1}
.chip.plan{outline:2px dashed var(--ac);outline-offset:-2px}
nav button{font-size:10px}

/*batik-start*/
/* artwork: batik-field.svg (all-over pattern) and batik-band.svg (diamond panel), drawn from the reference shirt */
body{background:linear-gradient(rgba(16,36,56,.80),rgba(16,36,56,.80)),url(batik-field.svg) 0 0/170px 170px fixed;background-color:var(--bg)}
.card{background:linear-gradient(rgba(27,53,80,.94),rgba(27,53,80,.94)),url(batik-field.svg) 0 0/170px 170px;background-color:var(--card)}
.shx{background:linear-gradient(rgba(16,36,56,.9),rgba(16,36,56,.9)),url(batik-field.svg) 0 0/170px 170px;background-color:var(--bg)}
#app::before{content:"";display:block;height:84px;margin:-14px -14px 12px;background:url(batik-band.svg) repeat-x 0 100%/40px 20px,url(batik-field.svg) 0 0/170px 170px;border-bottom:1px solid #0b1b2b}
nav{background:url(batik-band.svg) repeat-x 0 0/40px 20px,#0e2033;padding-top:20px}
h2{text-shadow:0 1px 0 #0006}
/*batik-end*/
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav>
<button data-v="today" onclick="go('today')"><b>🍽</b>Today</button>
<button data-v="foods" onclick="go('foods')"><b>🥑</b>Foods</button>
<button data-v="meals" onclick="go('meals')"><b>🥣</b>Meals</button>
<button data-v="plan" onclick="go('plan')"><b>🗓</b>Plan</button>
<button data-v="trends" onclick="go('trends')"><b>📊</b>Trends</button>
<button data-v="weight" onclick="go('weight')"><b>⚖️</b>Weight</button>
</nav>
<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const r0=x=>Math.round(x),r1=x=>Math.round(x*10)/10;
const num=v=>{const n=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isNaN(n)?0:n};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const short=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src+' (are you online?)'));document.head.appendChild(s)})}

/* ---------- state (all stored on the phone, in localStorage) ---------- */
const KEY='fuel.v1';
const def=()=>({settings:{kcal:2200,p:160,f:70,c:230,height:178,age:30,sex:'m',activity:1.4,targetKg:null,rate:0.5,tdeeOffset:0,protPerKg:null,stepGoal:8000,baseSteps:null,eatBack:100},foods:[],meals:[],log:{},weights:[],auto:{},recent:[],cats:{food:[],meal:[]},workouts:{},exercise:{},steps:{},workoutPlan:{},shopDone:{},meas:{},measTypes:['Waist','Chest','Hips','Arm','Thigh','Neck']});
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j){const d=def();return Object.assign(d,j,{settings:Object.assign(d.settings,j.settings||{}),cats:Object.assign({food:[],meal:[]},j.cats||{})})}}catch(e){}return def()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Storage full or blocked')}}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const SLOTS=['Breakfast','Lunch','Dinner','Snacks'];
const COL={p:'#6db3e0',c:'#e8c887',f:'#e0948a'};
let view='today',date=today(),range=7,fcWeeks=12,fcCustom=2000,foodQ='',foodCat='',mealCat='',wRange=30;

function dayTotals(d){const t={k:0,p:0,f:0,c:0};(S.log[d]||[]).forEach(e=>{if(e.planned)return;t.k+=e.k;t.p+=e.p;t.f+=e.f;t.c+=e.c});return t}
function plannedTotals(d){const t={k:0,p:0,f:0,c:0};(S.log[d]||[]).forEach(e=>{if(!e.planned)return;t.k+=e.k;t.p+=e.p;t.f+=e.f;t.c+=e.c});return t}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  $('#app').innerHTML=({today:vToday,foods:vFoods,meals:vMeals,plan:vPlan,trends:vTrends,weight:vWeight})[view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
}

/* ---------- bottom sheets ---------- */
const SH=[];
function sheet(html){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="shx">${html}</div>`;
  ov.addEventListener('click',e=>{if(e.target===ov)closeSheet(ov)});
  document.body.appendChild(ov);SH.push(ov);
  ov.body=ov.firstChild;return ov;
}
function closeSheet(ov){if(ov._cleanup)ov._cleanup();ov.remove();const i=SH.indexOf(ov);if(i>-1)SH.splice(i,1)}
function closeAll(){while(SH.length)closeSheet(SH[SH.length-1])}

/* ---------- food snapshots ---------- */
// food: {id,name,brand,g,defG,label,k,p,f,c,fav,barcode}. Nutrients are per `g` grams (or per 1 serving when g is null)
function snap(food,val){
  const mult=val/(food.g||1);
  const unit=food.g?`${r1(val)} g`:`${r1(val)} × ${food.label||'serving'}`;
  return {foodId:food.id,name:food.name+(food.brand?` (${food.brand})`:''),desc:unit,k:food.k*mult,p:food.p*mult,f:food.f*mult,c:food.c*mult};
}
function qtySheet(food,cb){
  const ov=sheet(`<h3>${esc(food.name)}</h3><div class="muted">${esc(food.brand||'')} · per ${food.g?food.g+' g':'1 '+esc(food.label||'serving')}: ${r0(food.k)} kcal, P${r1(food.p)} C${r1(food.c)} F${r1(food.f)}</div>
  <label>${food.g?'Amount (grams)':'Number of '+esc(food.label||'servings')}</label><input id="qv" type="number" inputmode="decimal" step="any" value="${food.defG||food.g||1}">
  <div id="qp" class="card" style="margin-top:10px"></div><button class="pri" id="qok" style="width:100%">Add</button>`);
  const inp=$('#qv',ov),upd=()=>{const s=snap(food,num(inp.value));$('#qp',ov).innerHTML=`<b>${r0(s.k)} kcal</b> &nbsp; <span style="color:${COL.p}">P ${r1(s.p)}</span> &nbsp; <span style="color:${COL.c}">C ${r1(s.c)}</span> &nbsp; <span style="color:${COL.f}">F ${r1(s.f)}</span>`};
  inp.oninput=upd;upd();setTimeout(()=>{inp.focus();inp.select()},50);
  $('#qok',ov).onclick=()=>{const v=num(inp.value);if(v<=0)return toast('Enter an amount');
    S.recent=[food.id,...S.recent.filter(x=>x!==food.id)].slice(0,40);save();closeAll();cb(snap(food,v))};
}

/* ---------- food picker ---------- */
function pickFood(cb,opts={}){
  let tab='fav',q='',mc='';
  const ov=sheet(`<h3>Add food</h3>
  <input id="pq" placeholder="Search foods" autocomplete="off">
  <div class="chips" id="pt"></div>
  <div id="pl"></div>
  <div class="g2" style="margin-top:10px"><button id="psc">📷 Scan barcode</button><button id="plb">🏷 Scan label</button></div><button id="pqa" style="width:100%;margin-top:8px">⚡ Quick add</button>
  <button id="pnf" style="width:100%;margin-top:8px">+ Create new food</button>`);
  const tabs=[['fav','★ Favourites'],...S.cats.food.map(c=>['c:'+c.id,c.name]),['recent','Recent'],['all','All foods']];if(opts.meal)tabs.push(['meal','Meals']);
  const draw=()=>{
    $('#pt',ov).innerHTML=tabs.map(([k,l])=>`<button class="chip ${tab===k?'on':''}" data-t="${k}">${l}</button>`).join('');
    ov.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    const toks=q.toLowerCase().split(/\s+/).filter(Boolean);let html='';
    if(tab==='meal'){
      const ms=S.meals.filter(m=>(!mc||(m.cats||[]).includes(mc))&&toks.every(t=>m.name.toLowerCase().includes(t)));
      html=`<div class="chips"><button class="chip ${mc?'':'on'}" data-mc="">All</button>${S.cats.meal.map(c=>`<button class="chip ${mc===c.id?'on':''}" data-mc="${c.id}">${esc(c.name)}</button>`).join('')}</div>`+ms.map(m=>`<div class="row" data-m="${m.id}"><div>${esc(m.name)}<div class="muted">${m.items.length} items</div></div><b>${r0(m.items.reduce((a,i)=>a+i.k,0))}</b></div>`).join('')||'<div class="muted">No meals yet</div>';
    }else{
      let list=S.foods;
      if(q)list=list.filter(f=>toks.every(t=>(f.name+' '+(f.brand||'')).toLowerCase().includes(t)));
      else if(tab.startsWith('c:'))list=list.filter(f=>(f.cats||[]).includes(tab.slice(2)));
      else if(tab==='fav')list=list.filter(f=>f.fav);
      else if(tab==='recent')list=S.recent.map(id=>S.foods.find(f=>f.id===id)).filter(Boolean);
      const total=list.length;list=list.slice(0,60);
      html=list.map(f=>`<div class="row" data-f="${f.id}"><div>${esc(f.name)}<div class="muted">${esc(f.brand||'')} ${f.g?'per '+f.g+' g':'per '+esc(f.label||'serving')} · P${r0(f.p)} C${r0(f.c)} F${r0(f.f)}</div></div><b>${r0(f.k)}</b></div>`).join('');
      if(!html)html=`<div class="muted">${q?'No match. Try All foods, scan, or create it.':tab==='fav'?'No favourites yet. Star foods in the Foods tab.':'Nothing here yet.'}</div>`;
      if(total>60)html+=`<div class="muted">Showing 60 of ${total}. Keep typing to narrow.</div>`;
    }
    $('#pl',ov).innerHTML=html;
    ov.querySelectorAll('[data-f]').forEach(r=>r.onclick=()=>qtySheet(S.foods.find(f=>f.id===r.dataset.f),cb));
    ov.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{mc=b.dataset.mc;draw()});
    ov.querySelectorAll('[data-m]').forEach(r=>r.onclick=()=>{closeAll();opts.meal(S.meals.find(m=>m.id===r.dataset.m))});
  };
  $('#pq',ov).oninput=e=>{q=e.target.value;if(q&&tab!=='meal')tab='all';draw()};
  $('#psc',ov).onclick=()=>scanFlow(f=>qtySheet(f,cb));
  $('#plb',ov).onclick=()=>labelFlow(f=>qtySheet(f,cb));
  $('#pnf',ov).onclick=()=>foodForm({},f=>qtySheet(f,cb));
  $('#pqa',ov).onclick=()=>quickAdd(cb);
  if(!S.foods.some(f=>f.fav)&&S.recent.length)tab='recent';
  if(!S.foods.length)tab='all';
  draw();
}
function quickAdd(cb){
  const ov=sheet(`<h3>Quick add</h3><label>Name</label><input id="qn" placeholder="e.g. Restaurant dinner">
  <div class="g4"><div><label>kcal</label><input id="qk" type="number" inputmode="decimal"></div><div><label>Protein</label><input id="qp1" type="number" inputmode="decimal"></div><div><label>Carbs</label><input id="qc" type="number" inputmode="decimal"></div><div><label>Fat</label><input id="qf" type="number" inputmode="decimal"></div></div>
  <div class="muted" style="margin-top:6px">Leave kcal blank to calculate from macros.</div>
  <button class="pri" id="qa" style="width:100%;margin-top:12px">Add</button>`);
  $('#qa',ov).onclick=()=>{const p=num($('#qp1',ov).value),c=num($('#qc',ov).value),f=num($('#qf',ov).value);let k=num($('#qk',ov).value);if(!k)k=p*4+c*4+f*9;if(!k)return toast('Enter calories or macros');
    closeAll();cb({name:$('#qn',ov).value||'Quick add',desc:'quick add',k,p,f,c})};
}

/* ---------- food form ---------- */
function foodForm(f,onSave){
  const isNew=!f.id;
  const basis=f.basis||(f.g===100||f.g==null&&isNew?'100':(f.g?'serve':(isNew?'100':'serve')));
  const ov=sheet(`<h3>${isNew?'New food':'Edit food'}</h3>${f.note?`<div class="card" style="margin:6px 0 4px;border-color:var(--ac)">${f.note}</div>`:''}
  <label>Name</label><input id="fn" value="${esc(f.name||'')}">
  <label>Brand (optional)</label><input id="fb" value="${esc(f.brand||'')}">
  <label>Nutrition values below are per</label>
  <select id="fx"><option value="100">100 g</option><option value="serve">1 serving</option></select>
  <div class="g4"><div><label>kcal</label><input id="fk" type="number" inputmode="decimal" step="any" value="${f.k??''}"></div><div><label>Protein g</label><input id="fp" type="number" inputmode="decimal" step="any" value="${f.p??''}"></div><div><label>Carbs g</label><input id="fc" type="number" inputmode="decimal" step="any" value="${f.c??''}"></div><div><label>Fat g</label><input id="ff" type="number" inputmode="decimal" step="any" value="${f.f??''}"></div></div>
  <div class="g2"><div><label id="l1">Serving name</label><input id="fl1" value="${esc(f.label||'')}" placeholder="e.g. 1 slice"></div><div><label id="l2">Serving size (g)</label><input id="fl2" type="number" inputmode="decimal" step="any" value="${(basis==='100'?f.defG:f.g)||''}"></div></div>
  <label>Categories</label><div class="chips" id="fcats"></div><label>Barcode (optional)</label><input id="fbc" inputmode="numeric" value="${esc(f.barcode||'')}">
  <div class="g2" style="margin-top:14px">${isNew?'':'<button class="dng" id="fd">Delete</button>'}<button class="pri" id="fs" ${isNew?'style="grid-column:1/3"':''}>Save</button></div>`);
  $('#fx',ov).value=basis;const fc=(f.cats||[]).slice();catPick('food',$('#fcats',ov),fc);
  const lab=()=>{const b=$('#fx',ov).value;$('#l2',ov).textContent=b==='100'?'Typical serving (g), optional':'Grams in 1 serving (optional)'};
  $('#fx',ov).onchange=lab;lab();
  $('#fs',ov).onclick=()=>{
    const name=$('#fn',ov).value.trim();if(!name)return toast('Name needed');
    const b=$('#fx',ov).value,sg=num($('#fl2',ov).value);
    const o=Object.assign(f.id?f:{id:uid(),fav:false},{name,brand:$('#fb',ov).value.trim(),k:num($('#fk',ov).value),p:num($('#fp',ov).value),c:num($('#fc',ov).value),f:num($('#ff',ov).value),barcode:$('#fbc',ov).value.trim(),label:$('#fl1',ov).value.trim()});
    if(b==='100'){o.g=100;o.defG=sg||null;o.label=o.label||'serving'}else{o.g=sg||null;o.defG=null;o.label=o.label||'serving'}
    o.cats=fc;if(isNew)S.foods.unshift(o);save();closeSheet(ov);toast('Saved');onSave&&onSave(o);
  };
  if(!isNew)$('#fd',ov).onclick=()=>{if(confirm('Delete this food from the database?')){S.foods=S.foods.filter(x=>x.id!==f.id);save();closeSheet(ov);render()}};
}

/* ---------- barcode ---------- */
function scanFlow(onFood){
  const ov=sheet(`<h3>Scan barcode</h3><div class="vid"><video id="sv" playsinline muted></video></div><div class="muted" id="sm">Starting camera…</div>
  <label>Or type the barcode</label><div class="bar"><input id="sb" inputmode="numeric" placeholder="e.g. 9300633..."><button id="sg" class="pri">Look up</button></div>`);
  let stream=null,stopped=false;
  ov._cleanup=()=>{stopped=true;if(stream)stream.getTracks().forEach(t=>t.stop())};
  const done=code=>{if(stopped)return;closeSheet(ov);barcode(code,onFood)};
  $('#sg',ov).onclick=()=>{const c=$('#sb',ov).value.trim();if(c)done(c)};
  (async()=>{
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      const v=$('#sv',ov);v.srcObject=stream;await v.play();$('#sm',ov).textContent='Point the camera at a barcode';
      if('BarcodeDetector' in window){
        const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']});
        const loop=async()=>{if(stopped)return;try{const r=await det.detect(v);if(r.length)return done(r[0].rawValue)}catch(e){}setTimeout(loop,200)};loop();
      }else{
        await loadScript(NATIVE?'zxing.min.js':'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js');
        const rd=new ZXing.BrowserMultiFormatReader();
        rd.decodeFromStream(stream,v,res=>{if(res)done(res.getText())});
      }
    }catch(e){$('#sm',ov).textContent='Camera unavailable ('+(e.message||e)+'). You can type the barcode below.'}
  })();
}
async function barcode(code,onFood){
  const have=S.foods.find(f=>f.barcode===code);
  if(have){toast('Found in your database');return onFood(have)}
  toast('Looking up '+code+'…');
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_quantity`);
    const j=await r.json();
    if(j.status===1&&j.product){
      const n=j.product.nutriments||{};
      let k=n['energy-kcal_100g'];if(k==null&&n['energy_100g']!=null)k=n['energy_100g']/4.184;

    if(r.sat!=null&&r.f!=null&&r.sat>r.f&&c.sat&&!/\./.test(c.sat.raw)&&c.sat.v/10<=r.f)r.sat=c.sat.v/10;

const LO=()=>(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LabelOcr)||null;
async function imgToB64(file,max=2400){

  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);

}
function labelFlow(onFood){

function stacked(dates){

  const tot=data.map(x=>x.p+x.c+x.f);const max=Math.max(s.kcal*1.2,...tot,100);
  const y=v=>T+(H-T-B)*(1-v/max),bw=(W-L-R)/n,bar=Math.min(bw*.72,70);
  let g='';const step=[100,250,500,1000].find(x=>max/x<=6)||1000;
  for(let v=0;v<=max;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#2f4d6c"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#a3b9cc">${v}</text>`;
  data.forEach((x,i)=>{const cx=L+bw*i+bw/2;let base=0;[['f',COL.f],['c',COL.c],['p',COL.p]].forEach(([k,c])=>{if(x[k]>0){g+=`<rect x="${cx-bar/2}" y="${y(base+x[k])}" width="${bar}" height="${y(base)-y(base+x[k])}" fill="${c}"/>`;base+=x[k]}});
    const lab=n<=7?DOW[parse(dates[i]).getDay()]:(i%Math.ceil(n/6)===0?short(dates[i]):'');
    if(lab)g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="#a3b9cc">${lab}</text>`});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(s.kcal)}" y2="${y(s.kcal)}" stroke="#a9c08a" stroke-width="2" stroke-dasharray="5 4"/><text x="${W-R}" y="${y(s.kcal)-4}" text-anchor="end" font-size="10" fill="#a9c08a">target ${s.kcal}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function lines(series,o){
  const W=360,H=210,L=40,B=24,T=10,R=8;let xs=[],ys=[];series.forEach(s=>{if(s.hline!=null)ys.push(s.hline);(s.pts||[]).forEach(p=>{xs.push(p[0]);ys.push(p[1])})});
  if(!xs.length)return '';let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(o.x0!=null){x0=o.x0;x1=o.x1}if(x1===x0)x1=x0+1;if(y1-y0<1){y0-=.5;y1+=.5}
  const pd=(y1-y0)*.1;y0-=pd;y1+=pd;const X=v=>L+(W-L-R)*(v-x0)/(x1-x0),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));let g='';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2f4d6c"/><text x="${L-4}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="#a3b9cc">${r1(v)}</text>`}
  for(let i=0;i<=4;i++){const v=x0+(x1-x0)*i/4;g+=`<text x="${X(v)}" y="${H-8}" text-anchor="${i===4?'end':i===0?'start':'middle'}" font-size="10" fill="#a3b9cc">${o.xl(Math.round(v))}</text>`}
  series.forEach(s=>{if(s.hline!=null){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(s.hline)}" y2="${Y(s.hline)}" stroke="${s.color}" stroke-dasharray="4 4"/>`;return}

/* ---------- WEIGHT, FORECAST, PLAN ---------- */
const bmr=w=>10*w+6.25*S.settings.height-5*S.settings.age+(S.settings.sex==='m'?5:-161);
const tdee=w=>bmr(w)*S.settings.activity+(S.settings.tdeeOffset||0);
function sortedW(){return S.weights.slice().sort((a,b)=>a.date<b.date?-1:1)}
function trendW(ws){return ws.map(w=>{const lo=addDays(w.date,-6),xs=ws.filter(x=>x.date>=lo&&x.date<=w.date);return{date:w.date,kg:xs.reduce((a,x)=>a+x.kg,0)/xs.length}})}
const WR={7:{n:7,avg:3},30:{n:30,avg:7},90:{n:90,avg:7},365:{n:365,avg:14},0:{n:0,avg:14}};
function rollAvg(ws,win){return ws.map(w=>{const lo=addDays(w.date,-(win-1)),xs=ws.filter(x=>x.date>=lo&&x.date<=w.date);return{date:w.date,kg:xs.reduce((a,x)=>a+x.kg,0)/xs.length}})}
function estTdee(){
  const e=today(),st=addDays(e,-28),ws=sortedW().filter(w=>w.date>=st);if(ws.length<3)return null;
  const days=(parse(ws[ws.length-1].date)-parse(ws[0].date))/864e5;if(days<10)return null;
  const xs=ws.map(w=>(parse(w.date)-parse(ws[0].date))/864e5),ys=ws.map(w=>w.kg),mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  const ks=[];for(let d=st;d<=e;d=addDays(d,1)){const t=dayTotals(d);if(t.k>0)ks.push(t.k)}if(ks.length<10)return null;
  return{est:ks.reduce((a,b)=>a+b)/ks.length-slope*7700,slope,days:ks.length};
}
function sim(w0,kcal,weeks){const pts=[[0,w0]];let w=w0;for(let d=1;d<=weeks*7;d++){w+=(kcal-tdee(w))/7700;if(d%7===0)pts.push([d/7,w])}return pts}
const FC=['#a9c08a','#6db3e0','#e8c887','#e0948a','#b79ad1','#a3b9cc'];

  if(ws.length){
    const cfg=WR[wRange],t0=today(),start=cfg.n?addDays(t0,-(cfg.n-1)):ws[0].date,xi=d=>(parse(d)-parse(start))/864e5;
    const view=ws.filter(w=>w.date>=start),avg=rollAvg(ws,cfg.avg).filter(w=>w.date>=start);
    const ser=[{pts:view.map(w=>[xi(w.date),w.kg]),color:'#7691a8',dots:true,w:1},{pts:avg.map(w=>[xi(w.date),w.kg]),color:'#a9c08a',w:3}];
    if(s.targetKg)ser.push({hline:s.targetKg,color:'#e8c887'});

async function download(name,txt,type){
  const P=window.Capacitor&&Capacitor.Plugins;
  if(NATIVE&&P&&P.Filesystem&&P.Share){
    try{const r=await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,url:r.uri,dialogTitle:'Save or send'});return}
    catch(e){if(e&&/cancel/i.test(String(e.message||e)))return;toast('Could not export: '+(e.message||e));return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function pickFile(acc,cb){const i=document.createElement('input');i.type='file';i.accept=acc;i.onchange=()=>{if(i.files[0])cb(i.files[0])};i.click()}

    <label>Nutrition values in the sheet are per</label><select id="m_basis"><option value="100">100 g</option><option value="serve">1 serving</option></select>

      rows.forEach(r=>{const name=String(r[col.name]).trim();if(!name)return;const brand=col.brand?String(r[col.brand]).trim():'',key=(name+'|'+brand).toLowerCase();
        const sg=col.sg?num(r[col.sg]):0,o={name,brand,k:num(r[col.k]),p:col.p?num(r[col.p]):0,c:col.c?num(r[col.c]):0,f:col.f?num(r[col.f]):0,barcode:col.bc?String(r[col.bc]).trim():'',label:(col.label&&String(r[col.label]).trim())||'serving'};
        if(per100){o.g=100;o.defG=sg||null}else{o.g=sg||null;o.defG=null}
        const ex=idx.get(key);if(ex){Object.assign(ex,o);upd++}else{const n=Object.assign({id:uid(),fav:false},o);S.foods.push(n);idx.set(key,n);add++}});
      save();closeAll();render();toast(`Imported: ${add} new, ${upd} updated`);
    };
  }catch(e){toast(e.message||'Could not read file')}

let hcState='unknown',_hcLast=0;
const HS=()=>(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.HealthSteps)||null;
async function syncSteps(force){
  const hs=HS();if(!NATIVE||!hs)return;
  if(!force&&Date.now()-_hcLast<60000)return;_hcLast=Date.now();
  try{
    const st=await hs.status();
    if(!st.available)hcState='unavailable';
    else if(!st.granted)hcState='need';
    else{const r=await hs.readDailySteps({days:30});(r.days||[]).forEach(x=>{if(x.steps>0||S.steps[x.date]==null)S.steps[x.date]=x.steps});hcState='ok';save()}
  }catch(e){hcState='error'}
  if(!SH.length&&(view==='today'||view==='trends'))render();
}
async function connectSteps(){const hs=HS();if(!hs)return;try{await hs.requestPermission()}catch(e){toast('Permission not granted')}syncSteps(true)}

  const has=Object.keys(S.steps).length>0;

  let note='';
  if(NATIVE&&hcState==='need')note=`<button class="pri" style="width:100%;margin-top:8px" onclick="connectSteps()">Connect Health Connect to sync steps</button>`;
  else if(NATIVE&&hcState==='unavailable')note=`<div class="warn" style="margin-top:6px">Health Connect isn't available on this phone. Install it from the Play Store to sync steps.</div>`;

  return `<div class="card"><div class="sh2"><b>Steps</b><span class="muted">${v.toLocaleString()} of ${goal.toLocaleString()}</span></div>
  <div class="bt" style="margin:4px 0 8px"><i style="width:${Math.min(100,v/goal*100)}%;background:${v>=goal?'var(--ac)':'#6db3e0'}"></i></div>

function stepsSummary(dates){
  if(!Object.keys(S.steps).length)return '';
  const goal=S.settings.stepGoal||8000,vals=dates.map(d=>S.steps[d]||0),have=vals.filter(v=>v>0),n=have.length||1,avg=have.reduce((a,b)=>a+b,0)/n,hit=have.filter(v=>v>=goal).length;
  let chart='';
  if(dates.length>1){
    const W=360,H=150,L=40,B=22,T=8,R=6,max=Math.max(goal*1.2,...vals,1000),y=v=>T+(H-T-B)*(1-v/max),bw=(W-L-R)/dates.length,bar=Math.min(bw*.72,40);

    vals.forEach((v,i)=>{const cx=L+bw*i+bw/2;if(v>0)g+=`<rect x="${cx-bar/2}" y="${y(v)}" width="${bar}" height="${y(0)-y(v)}" fill="${v>=goal?'#a9c08a':'#6db3e0'}"/>`;
      const lab=dates.length<=7?DOW[parse(dates[i]).getDay()]:(i%Math.ceil(dates.length/6)===0?short(dates[i]):'');if(lab)g+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="10" fill="#a3b9cc">${lab}</text>`});
    g+=`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" stroke="#a9c08a" stroke-width="2" stroke-dasharray="5 4"/>`;

}

/* ---------- app updates (Android app only) ---------- */
// The access token lives in its own localStorage key, so it never ends up in a backup file.
const UP=()=>(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Updater)||null;
const UPK='fuel.upd';
const upd={ver:null,latest:null,busy:false};
function updCfg(){try{return JSON.parse(localStorage.getItem(UPK)||'{}')}catch(e){return {}}}
function updSave(c){try{localStorage.setItem(UPK,JSON.stringify(c))}catch(e){}}
async function updInfo(){const u=UP();if(!NATIVE||!u)return null;try{upd.ver=await u.info()}catch(e){}return upd.ver}
async function updCheck(manual){
  const u=UP();if(!NATIVE||!u)return;
  const c=updCfg();
  if(!c.token){if(manual)toast('Add your update token first');return}
  if(!manual&&c.last&&Date.now()-c.last<3600e3)return;
  try{
    if(!upd.ver)await updInfo();
    const r=await u.check({token:c.token});
    c.last=Date.now();updSave(c);
    const n=+((/^v?\d+\.(\d+)/.exec(r.tag||'')||[])[1])||0;
    const had=!!upd.latest;
    if(upd.ver&&n>upd.ver.versionCode&&r.assetId){
      upd.latest={tag:r.tag,n,notes:String(r.notes||'').split('\n')[0].slice(0,140),assetId:String(r.assetId)};
      if(manual)toast('Update available: '+r.tag);
      render();
    }else{
      upd.latest=null;
      if(manual)toast('You are up to date'+(upd.ver?' ('+upd.ver.versionName+')':''));
      if(had)render();
    }
  }catch(e){if(manual)toast('Update check failed: '+(e&&e.message||e))}
}
function updFooter(){
  if(!NATIVE)return '';
  const v=upd.ver?`Fuel ${esc(upd.ver.versionName)}`:'Fuel';
  return `<div style="text-align:center;margin:16px 0 4px" class="muted">${v} · <a href="#" style="color:var(--ac)" onclick="event.preventDefault();updNow()">Check for update</a></div>`;
}
function updSetup(){
  if(!NATIVE||updCfg().token)return '';
  return `<div class="card"><b>Turn on in-app updates</b><div class="muted" style="margin:4px 0 8px">Add a read-only GitHub token once and Fuel can find and install new versions by itself.</div><button class="sm" onclick="settingsSheet()">Set up</button></div>`;
}
function updNow(){if(!updCfg().token){toast('Add your update token first');settingsSheet();return}updCheck(true)}
function updBanner(){
  const l=upd.latest;if(!NATIVE||!l)return '';
  return `<div class="card" style="border-color:var(--ac)"><div class="sh2"><b>Update available · ${esc(l.tag.replace(/^v/,''))}</b></div>${l.notes?`<div class="muted" style="margin-bottom:8px">${esc(l.notes)}</div>`:''}<button class="pri" style="width:100%" id="updbtn" onclick="updInstall()"${upd.busy?' disabled':''}>${upd.busy?'Downloading…':'Download &amp; install'}</button></div>`;
}
async function updInstall(){
  const u=UP(),l=upd.latest,c=updCfg();if(!u||!l||upd.busy)return;
  upd.busy=true;render();
  let h=null;
  try{
    h=await u.addListener('progress',e=>{const b=document.getElementById('updbtn');if(b)b.textContent='Downloading… '+e.pct+'%'});
    const r=await u.install({token:c.token,assetId:l.assetId});
    if(r&&r.needsPermission)toast('Allow installs from Fuel, come back, then tap again');
  }catch(e){toast('Update failed: '+(e&&e.message||e))}
  try{if(h)h.remove()}catch(e){}
  upd.busy=false;render();
}

/* ---------- boot ---------- */
if('serviceWorker' in navigator){if(NATIVE)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});else navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
// first run: load the bundled starter food database (AFCD) once
if(!localStorage.getItem('fuel.seeded')&&!S.foods.length){
  fetch('foods-seed.json').then(r=>r.json()).then(a=>{S.foods=a;save();localStorage.setItem('fuel.seeded','1');render();toast(a.length+' starter foods loaded')}).catch(()=>{});
}
if(NATIVE){updInfo().then(()=>{if(!SH.length&&view==='today')render()});syncSteps(true);updCheck();document.addEventListener('visibilitychange',()=>{if(!document.hidden){syncSteps();updCheck()}})}
// Android home-screen shortcuts (long-press the app icon)
(function(){
  const a=new URLSearchParams(location.search).get('action');if(!a)return;
  try{history.replaceState(null,'',location.pathname)}catch(e){}
  date=today();view='today';render();
  const cb=sn=>{logSnap(sn,guessSlot(),today(),false);render();toast('Added')};
  setTimeout(()=>{if(a==='scan')scanFlow(f=>qtySheet(f,cb));else if(a==='add')pickFood(cb,{meal:m=>addMealTo(today(),m,guessSlot())})},350);
})();
</script>
</body>
</html>
