name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Bundle offline libraries into the app
        run: |
          cp node_modules/@zxing/library/umd/index.min.js www/zxing.min.js
          cp node_modules/xlsx/dist/xlsx.full.min.js www/xlsx.full.min.js

      - name: Create the Android project
        run: npx cap add android

      - name: Add Health Connect, camera, signing and icon
        run: |
          pip install pillow
          python3 scripts/patch_android.py

      - name: Sync web files into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fuel-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
